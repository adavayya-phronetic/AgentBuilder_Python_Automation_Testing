[pytest]
addopts = --alluredir=Reports/Allure_reports
markers =
    flaky: rerun on known transient failures (pytest-rerunfailures)
    login: Login page tests
    agent_creation: Agent creation tests
    knowledge_base: Knowledge base upload/delete tests
    tool_attachment: Tool attachment / graph config tests
    agent_validation: Agent configuration validation tests
    search: Agent search functionality tests
    chat: Agent Chat tab tests
    meet: Agent Meet tab tests
