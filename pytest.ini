[pytest]
addopts = --alluredir=Reports/Allure_reports --clean-alluredir
markers =
    flaky: rerun on known transient failures (pytest-rerunfailures)
    login: Login page tests
    agent_creation: Agent creation tests
    knowledge_base: Knowledge base upload/delete tests
    knowledge_base_upload: Knowledge base file upload tests
    knowledge_base_delete: Knowledge base file delete tests
    tool_attachment: Tool attachment / graph config tests
    tool_creation: Tool creation tests
    agent_validation: Agent configuration validation tests
    search: Agent search functionality tests
    chat: Agent Chat tab tests
    meet: Agent Meet tab tests
    my_agents: My Agents landing page tests (creation prompt, templates, filters, search, cards)
    interact: Interact window tests (Build page's direct chat-with-agent panel)
    signup: Sign Up page tests
    dashboard: Dashboard page tests
